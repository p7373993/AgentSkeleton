name: data-csv-report-artifact
domain: data
goal: Read CSV metrics and write a short data report artifact.
config:
  permission_profile: trusted
files:
  data/quarterly.csv: |
    region,revenue,cost
    north,120,70
    south,90,55
    east,140,80
actions:
  - type: tool
    tool: read_file
    call_id: read-quarterly-csv
    arguments:
      path: data/quarterly.csv
  - type: tool
    tool: write_file
    call_id: write-data-report
    arguments:
      path: reports/quarterly-summary.txt
      content: |
        Quarterly data summary:
        Total revenue: 350
        Highest revenue region: east
      create_parent_dirs: true
  - type: final
    text: data report artifact ok
expect:
  status: completed
  answer: data report artifact ok
  observations: 2
  observations_detail:
    - tool: read_file
      success: true
      payload:
        path: data/quarterly.csv
    - tool: write_file
      success: true
      payload:
        path: reports/quarterly-summary.txt
  files:
    reports/quarterly-summary.txt: |
      Quarterly data summary:
      Total revenue: 350
      Highest revenue region: east
