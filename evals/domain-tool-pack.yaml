name: domain-tool-pack
domain: tool_packs
goal: Classify a finance request using a scenario-provided tool pack.
config:
  tool_modules:
    - agentskeleton.domain_tools
  enabled_tools:
    - classify_domain
actions:
  - type: tool
    tool: classify_domain
    call_id: classify-domain
    arguments:
      text: reconcile Q4 invoice anomalies
