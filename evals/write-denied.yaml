name: write-denied
domain: reliability
goal: Deny an unconfirmed workspace write.
actions:
  - type: tool
    tool: write_file
    call_id: write-1
    arguments:
      path: generated.txt
      content: blocked
expect:
  status: denied
  observations: 1
  observations_detail:
    - tool: write_file
      success: false
      error: Permission denied
