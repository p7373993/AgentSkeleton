name: shell-recursive-delete-blocked
domain: reliability
goal: Block recursive shell deletion before execution.
actions:
  - type: tool
    tool: shell
    call_id: recursive-delete
    arguments:
      command: "Remove-Item -LiteralPath C:\\code\\AgentSkeleton -Recurse -Force"
expect:
  status: blocked
  reason: Shell command looks destructive
  observations: 1
  observations_detail:
    - tool: shell
      success: false
      summary: Shell command looks destructive
      error: Permission blocked
  events:
    - type: policy_decision
      payload:
        tool_name: shell
        outcome: block
        reason: Shell command looks destructive
    - type: run_finished
      payload:
        status: blocked
        reason: Shell command looks destructive
