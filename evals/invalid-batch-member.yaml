name: invalid-batch-member
domain: reliability
goal: Stop cleanly when a tool-call batch contains an unsupported member.
actions:
  - type: invalid_batch_member
expect:
  status: invalid_action
  reason: "Model returned unsupported action: dict"
  observations: 0
  events:
    - type: run_error
      payload:
        status: invalid_action
        error_type: dict
        error: "Model returned unsupported action: dict"
    - type: run_finished
      payload:
        status: invalid_action
        reason: "Model returned unsupported action: dict"
