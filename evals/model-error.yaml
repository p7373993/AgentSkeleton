name: model-error
domain: reliability
goal: Handle a scripted model failure as observable run state.
config:
  model_retry_attempts: 1
actions:
  - type: error
    message: model unavailable
expect:
  status: model_error
  reason: "Model call failed: RuntimeError"
  observations: 0
  events:
    - type: run_error
      payload:
        status: model_error
        attempt: 1
        max_attempts: 1
        error_type: RuntimeError
        error: model unavailable
    - type: run_finished
      payload:
        status: model_error
        reason: "Model call failed: RuntimeError"
