name: model-error
domain: reliability
goal: Handle a scripted model failure as observable run state.
actions:
  - type: error
    message: model unavailable
expect:
  status: model_error
  reason: "Model call failed: RuntimeError"
  observations: 0
  events:
    - type: run_error
      payload:
        status: model_error
        error_type: RuntimeError
    - type: run_finished
      payload:
        status: model_error
        reason: "Model call failed: RuntimeError"
