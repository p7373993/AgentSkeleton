name: write-denied
domain: reliability
goal: Deny an unconfirmed workspace write.
actions:
  - type: tool
    tool: write_file
    call_id: write-1
    arguments:
      path: generated.txt
      content: blocked
expect:
  status: denied
  reason: Tool writes files in the workspace
  observations: 1
  observations_detail:
    - tool: write_file
      success: false
      error: Permission denied
  events:
    - type: policy_decision
      payload:
        tool_name: write_file
        outcome: confirm
        reason: Tool writes files in the workspace
    - type: run_finished
      payload:
        status: denied
        reason: Tool writes files in the workspace
