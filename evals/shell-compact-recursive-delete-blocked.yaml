name: shell-compact-recursive-delete-blocked
domain: reliability
goal: Block compact recursive shell deletion before execution.
actions:
  - type: tool
    tool: shell
    call_id: compact-recursive-delete
    arguments:
      command: "rm -rf build"
expect:
  status: blocked
  reason: Shell command looks destructive
  observations: 1
  observations_detail:
    - tool: shell
      success: false
      summary: Shell command looks destructive
      error: Permission blocked
  events:
    - type: policy_decision
      payload:
        tool_name: shell
        outcome: block
        reason: Shell command looks destructive
    - type: run_finished
      payload:
        status: blocked
        reason: Shell command looks destructive
