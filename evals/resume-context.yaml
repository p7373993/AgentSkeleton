name: resume-context
domain: reliability
goal: Continue a task with prior conversation context.
conversation:
  - role: user
    content: remember alpha
  - role: assistant
    content: alpha stored
actions:
  - type: assert_conversation
    contents:
      - remember alpha
      - alpha stored
  - type: final
    text: resume context ok
expect:
  status: completed
  answer: resume context ok
  events:
    - type: run_started
      payload:
        resumed: true
        conversation_turns: 2
        scenario: resume-context
    - type: run_snapshot
      payload:
        conversation_turns: 2
        final_status: completed
        final_answer: resume context ok
        observations: []
    - type: run_finished
      payload:
        status: completed
        answer: resume context ok
